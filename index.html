<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الطلبات والأرباح</title><style>body{font:16px Tahoma;background:#f3f5fa;margin:30px;color:#182230}main{max-width:900px;margin:auto;background:white;padding:24px;border-radius:16px}button,input{padding:10px;margin:5px;border:1px solid #ccd;border-radius:8px}button{background:#3157d5;color:white}table{width:100%;margin-top:20px;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:right}</style><main><h1>لوحة متابعة الطلبات والأرباح</h1><p>إدارة العملاء والدفعات وتكلفة التصنيع — جنيه مصري</p><form id="f"><input id="n" placeholder="اسم العميل" required><input id="m" placeholder="رقم الموبايل"><input id="t" placeholder="نوع الأوردر"><input id="v" type="number" placeholder="إجمالي الأوردر" required><input id="c" type="number" placeholder="تكلفة التصنيع" required><button>إضافة أوردر</button></form><h2>الأوردرات</h2><table><thead><tr><th>العميل</th><th>الموبايل</th><th>النوع</th><th>الإجمالي</th><th>التصنيع</th><th>الربح</th></tr></thead><tbody id="rows"></tbody></table><h3 id="summary"></h3></main><script>let a=JSON.parse(localStorage.getItem('orders')||'[]');function draw(){let s=0,p=0;a.forEach(x=>{s+=x.v;p+=x.v-x.c});document.getElementById('summary').textContent='إجمالي الأوردرات: '+s+' ج.م | صافي الربح المتوقع: '+p+' ج.م';document.getElementById('rows').innerHTML=a.map(x=>'<tr><td>'+x.n+'</td><td>'+x.m+'</td><td>'+x.t+'</td><td>'+x.v+'</td><td>'+x.c+'</td><td>'+(x.v-x.c)+'</td></tr>').join('');localStorage.setItem('orders',JSON.stringify(a))}document.getElementById('f').onsubmit=e=>{e.preventDefault();a.push({n:n.value,m:m.value,t:t.value,v:+v.value,c:+c.value});draw();e.target.reset()};draw();</script></main></html>
